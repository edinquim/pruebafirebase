<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alumnos - Quinto Perito</title>
    <style>
        /* CSS básico y estético para los estudiantes */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ffca28; /* Color representativo de Firebase */
            border: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #f5b041;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Estudiantes</h2>
        <!-- Formulario HTML básico -->
        <form id="formularioAlumno">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>

            <label for="codigo">Código de Alumno:</label>
            <input type="text" id="codigo" placeholder="Ej. 2026-001" required>

            <button type="submit">Guardar en Firebase</button>
        </form>
    </div>

       <!-- CONEXIÓN A FIREBASE (Usando la versión simplificada para Web) -->
    <script type="module">
        // 1. Importar los módulos necesarios de Firebase desde la web (CORREGIDO AQUÍ)
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push } from "https://gstatic.com";

        // 2. CONFIGURACIÓN DE TU PROYECTO 
const firebaseConfig = {
  apiKey: "AIzaSyDaGBu5IDFufc2oI6aP3Djlo5M9wbOqFq8",
  authDomain: "registroestudiantes-c2b49.firebaseapp.com",
  databaseURL: "https://registroestudiantes-c2b49-default-rtdb.firebaseio.com",
  projectId: "registroestudiantes-c2b49",
  storageBucket: "registroestudiantes-c2b49.firebasestorage.app",
  messagingSenderId: "13690814290",
  appId: "1:13690814290:web:72776d2de4a82ff463848b"
};

        // 3. Inicializar Firebase y la Base de Datos
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);


        // 4. Capturar el evento del formulario con JavaScript
        document.getElementById('formularioAlumno').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            // Obtener los valores que escribió el estudiante
            const nombreAlumno = document.getElementById('nombre').value;
            const codigoAlumno = document.getElementById('codigo').value;

            // Definir en qué "carpeta" o nodo de la base de datos se guardará (ej. "alumnos")
            const alumnosRef = ref(database, 'alumnos');

            // Enviar los datos a la nube
            push(alumnosRef, {
                nombre: nombreAlumno,
                codigo: codigoAlumno,
                fechaRegistro: new Date().toLocaleString()
            })
            .then(() => {
                alert("¡Datos guardados con éxito en la nube!");
                document.getElementById('formularioAlumno').reset(); // Limpiar formulario
            })
            .catch((error) => {
                alert("Error al guardar: " + error.message);
            });
        });
    </script>
</body>
</html>
